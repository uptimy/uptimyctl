name: Bug report
description: A command fails or doesn't do what it says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Found a security issue? Please report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `uptimyctl version`.
      placeholder: v1.10.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What the command printed (`-o json` helps). Please remove any API keys (upt_...) first.
      render: text
